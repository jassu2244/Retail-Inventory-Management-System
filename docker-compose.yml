services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rims
      POSTGRES_USER: rims
      POSTGRES_PASSWORD: rims
    ports: ["5432:5432"]
    volumes: ["rims_pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rims
      SPRING_DATASOURCE_USERNAME: rims
      SPRING_DATASOURCE_PASSWORD: rims
    ports: ["8080:8080"]
    depends_on: [postgres]
volumes:
  rims_pgdata:
